<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestão de Registros</title>
  <link rel="stylesheet" href="style_gest.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="loginGestao">
    <h2>Login - Gestão</h2>
    <p>Digite a senha:</p>
    <form id="formGestao">
      <input type="password" id="senhaGestao" placeholder="Senha de Gestão" required />
      <button type="submit">Entrar</button>
      <button type="button" onclick="voltarInicio()" class="voltar">Voltar</button>
    </form>
    <p id="erroLoginGestao" class="erroLogin"></p>
  </div>

  <!-- GESTÃO -->
  <div id="gestaoContainer" style="display: none;">
    <h1>Gestão de Registros de Viagem</h1>
    <button id="btnExportar">Exportar CSV</button>
    <button id="btnSair">Sair</button>
    <table id="tabelaRegistros">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Pessoas</th>
          <th>Período</th>
          <th>Flexível</th>
          <th>Aeroporto</th>
          <th>Regime</th>
          <th>Valor</th>
          <th>Observações</th>
          <th>Registro</th>
          <th>Próximo Contato</th>
          <th>Agente</th>
          <th>Destinos</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- MODAL EDIÇÃO -->
  <div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span id="closeModalBtn" class="close">&times;</span>
      <h2>Editar Registro</h2>
      <form id="editForm">
        <input type="hidden" id="editIndex" />

        <label>Nome:</label>
        <input type="text" id="editNome" required />

        <label>Nº de Pessoas:</label>
        <input type="number" id="editPessoas" required />

        <label>Data Ida:</label>
        <input type="date" id="editDataIda" required />

        <label>Data Volta:</label>
        <input type="date" id="editDataVolta" />

        <label>Flexível:</label>
        <select id="editFlexivel">
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>

        <label>Aeroporto:</label>
        <input type="text" id="editAeroporto" />

        <label>Regime:</label>
        <input type="text" id="editRegime" />

        <label>Valor:</label>
        <input type="text" id="editValor" />

        <label>Observações:</label>
        <textarea id="editObservacoes"></textarea>

        <label>Data de Registro:</label>
        <input type="date" id="editDataRegistro" required />

        <label>Data Próximo Contato:</label>
        <input type="date" id="editDataProximoContato" />

        <label>Nome do Agente:</label>
        <input type="text" id="editNomeAgente" />

        <label>Destinos:</label>
        <input type="text" id="editDestinoInput" placeholder="Digite o destino..." />
        <ul id="editSugestoes" class="sugestoes-lista"></ul>
        <div id="editDestinosSelecionados" class="destinos-tags"></div>
        <input type="hidden" id="editDestinosHidden" />

        <div class="botoes-modal">
          <button type="submit">Salvar Alterações</button>
          <button type="button" id="cancelEdit">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="script.js"></script>
</body>
</html>
