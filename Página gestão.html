<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestão de Registros</title>
  <link rel="stylesheet" href="style_gest.css" />
</head>
<body>
  <div id="loginGestao">
    <h2>Login - Gestão</h2>
    <p>Digite a senha:</p>
    <form id="formGestao">
      <input type="password" id="senhaGestao" />
      <button type="submit">Entrar</button>
      <button type="button" onclick="voltarInicio()" class="voltar">Voltar</button>
    </form>
    <p id="erroLoginGestao" class="erroLogin"></p>
  </div>

  <div id="gestaoContainer" style="display: none;">
    <h1>Registros de Clientes</h1>
    <div class="table-container">
      <table id="tabelaRegistros">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Pessoas</th>
            <th>Período</th>
            <th>Flexível</th>
            <th>Aeroporto</th>
            <th>Regime</th>
            <th>Valor (€)</th>
            <th>Observações</th>
            <th>Data Registo</th>
            <th>Próx. Contacto</th>
            <th>Agente</th>
            <th>Destino(s)</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button id="btnExportar">Exportar CSV</button>
    <button id="btnSair">Sair</button>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close-button" id="closeModalBtn">&times;</span>
      <h2>Editar Registro de Cliente</h2>
      <form id="editForm">
        <input type="hidden" id="editIndex">

        <label for="editNome">Nome do Cliente:</label>
        <input type="text" id="editNome" name="nome" maxlength="50" required />

        <label for="editPessoas">Número de Pessoas:</label>
        <input type="number" id="editPessoas" name="pessoas" min="1" required />

        <label for="editDataIda">Data de Ida:</label>
        <input type="date" id="editDataIda" name="dataIda" required />

        <label for="editDataVolta">Data de Volta:</label>
        <input type="date" id="editDataVolta" name="dataVolta" />

        <label for="editFlexivel">Datas são flexíveis?</label>
        <select id="editFlexivel" name="flexivel">
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>

        <label for="editAeroporto">Aeroporto preferido:</label>
        <select id="editAeroporto" name="aeroporto">
          <option value="Lisboa">Lisboa</option>
          <option value="Porto">Porto</option>
          <option value="Faro">Faro</option>
          <option value="Outro">Outro</option>
        </select>

        <label for="editRegime">Tipo de Regime:</label>
        <select id="editRegime" name="regime">
          <option value="Nada incluído">Nada incluído</option>
          <option value="Pequeno-almoço">Pequeno-almoço</option>
          <option value="Meia pensão">Meia pensão</option>
          <option value="Tudo incluído">Tudo incluído</option>
        </select>

        <label for="editValor">Valor Máximo (€):</label>
        <input type="number" id="editValor" name="valor" min="0" required />

        <label for="editObservacoes">Observações sobre o cliente:</label>
        <textarea id="editObservacoes" name="observacoes"></textarea>

        <label for="editDataRegistro">Data de Registro:</label>
        <input type="date" id="editDataRegistro" name="dataRegistro" required />

        <label for="editDataProximoContato">Data para Próximo Contato:</label>
        <input type="date" id="editDataProximoContato" name="dataProximoContato" />

        <label for="editNomeAgente">Nome do Agente:</label>
        <select id="editNomeAgente" name="NomeAgente">
          <option value="Soaila Maia">Soaila Maia</option>
          <option value="Telma Pires">Telma Pires</option>
          <option value="Délcio Costa">Délcio Costa</option>
        </select>

        <label>Destino(s):</label>
        <div id="editDestinoWrapper" class="destino-wrapper">
          <input type="text" id="editDestinoInput" placeholder="Digite um destino..." />
          <ul id="editSugestoes" class="sugestoes"></ul>
          <div id="editDestinosSelecionados" class="destinos-selecionados"></div>
          <input type="hidden" id="editDestinosHidden" name="destinos" />
        </div>
        <button type="submit">Salvar Alterações</button>
        <button type="button" id="cancelEdit">Cancelar</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
