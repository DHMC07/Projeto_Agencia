<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestão de Registros</title>
  <link rel="stylesheet" href="style_gest.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="loginGestao">
    <h2>Login - Gestão</h2>
    <p>Digite a senha:</p>
    <form id="formGestao">
      <input type="password" id="senhaGestao" placeholder="Senha de Gestão" required />
      <button type="submit">Entrar</button>
      <button type="button" onclick="voltarInicio()" class="voltar">Voltar</button>
    </form>
    <p id="erroLoginGestao" class="erroLogin" style="color:red;"></p>
  </div>

  <!-- GESTÃO -->
  <div id="gestaoContainer" style="display: none;">
    <h1>Gestão de Registros de Viagem</h1>
    <button id="btnExportar">Exportar CSV</button>
    <button id="btnSair">Sair</button>
    <table id="tabelaRegistros">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Pessoas</th>
          <th>Período</th>
          <th>Flexível</th>
          <th>Aeroporto</th>
          <th>Regime</th>
          <th>Valor</th>
          <th>Observações</th>
          <th>Registro</th>
          <th>Próximo Contato</th>
          <th>Agente</th>
          <th>Destinos</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
